[package]
name = "yfitops"
version = "0.3.2"
description = "Spotify client"
authors = ["freethinkel"]
edition = "2021"

[lib]
name = "yfitops_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: without it the console is compiled out of release builds, and
# the menu item below would have nothing to open
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# unsafe-headers: without it the plugin drops `cookie`, `referer` and `origin`
# as forbidden by the fetch spec — and the whole session rests on sending
# Spotify's own cookie and posing as its web player
tauri-plugin-http = { version = "2.5.9", features = [
    "unsafe-headers",
    # the player's bundle is 4.6 MB raw and 1.3 MB gzipped, and without these
    # reqwest does not even ask for an encoding
    "gzip",
    "brotli",
    "deflate",
] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

# playback of our own: no Web Playback SDK, no Widevine, no api.spotify.com.
# librespot-core is a fork — see vendor/librespot-core/FORK.md
librespot-core = "0.8"
librespot-playback = "0.8"
librespot-connect = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
# gzip: the player's bundle is 4.6 MB raw and 1.3 MB compressed, and without
# it reqwest does not even ask for an encoding
reqwest = { version = "0.13.4", features = ["json", "gzip", "brotli"] }
regex = "1"
base64 = "0.22"
env_logger = "0.11.11"

[patch.crates-io]
librespot-core = { path = "vendor/librespot-core" }
librespot-playback = { path = "vendor/librespot-playback" }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25.0"
objc = { version = "0.2.7", features = ["exception"] }
objc_exception = "0.1.2"
block = "0.1.6"
